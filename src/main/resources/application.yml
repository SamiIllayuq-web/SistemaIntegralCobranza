spring:
  application:
    name: SistemaIntegralCobranza

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobranza}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:raticulacion}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Prueba conexiones cada 5 min para evitar que Supabase las cierre por inactividad
      keepaliveTime: 300000
      # Timeout de conexion (30 seg)
      connectionTimeout: 30000
      # Max lifetime de conexion (30 min — menor que el idle timeout de Supabase)
      maxLifetime: 1800000
      # Minimo de conexiones en el pool
      minimumIdle: 2
      # Maximo de conexiones
      maximumPoolSize: 10
      # Validar conexion al pedirla del pool
      connectionTestQuery: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

# Variables de entorno requeridas en producción:
# DB_URL, DB_USER, DB_PASSWORD, SERVER_PORT, SERVER_ADDRESS
