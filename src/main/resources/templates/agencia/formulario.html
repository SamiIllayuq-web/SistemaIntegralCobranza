<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${agenciaId != null ? 'Editar Agencia' : 'Nueva Agencia'}">Agencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Cobranza</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Inicio</a>
                <a class="nav-link" th:href="@{/agencias}">Agencias</a>
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/operaciones}">Operaciones</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${agenciaId != null ? 'Editar Agencia' : 'Nueva Agencia'}"></h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/agencias/guardar}" th:object="${agenciaForm}" method="post">
            <input type="hidden" name="agenciaId" th:value="${agenciaId}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre *</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="codigo" class="form-label">Código</label>
                    <input type="text" class="form-control" id="codigo" th:field="*{codigo}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="empresaId" class="form-label">Empresa *</label>
                    <select class="form-select" id="empresaId" th:field="*{empresaId}" required>
                        <option value="">Seleccione una empresa</option>
                        <option th:each="empresa : ${empresas}" th:value="${empresa.id}" th:text="${empresa.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
                </div>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" th:field="*{direccion}">
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/agencias}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
