<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${agenciaId != null ? 'Editar Agencia' : 'Nueva Agencia'}">Agencia — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <a th:href="@{/cartera/registros}">Registros</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);" th:text="${agenciaId != null ? 'Editar' : 'Nueva'}">Agencia</span>
        </div>
        <div class="topbar-actions">
<span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title" th:text="${agenciaId != null ? 'Editar Agencia' : 'Nueva Agencia'}">Agencia</h1>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger animate-in" th:text="${error}"></div>

        <form th:action="@{/agencias/guardar}" th:object="${agenciaForm}" method="post">
            <input type="hidden" name="agenciaId" th:value="${agenciaId}" />

            <div class="card animate-in stagger-1">
                <div class="card-header">Datos de la Agencia</div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div>
                            <label class="form-label">Código</label>
                            <input type="text" class="form-control" th:field="*{codigo}">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
                        <div>
                            <label class="form-label">Empresa *</label>
                            <select class="form-select" th:field="*{empresaId}" required>
                                <option value="">Seleccione una empresa</option>
                                <option th:each="empresa : ${empresas}"
                                        th:value="${empresa.id}"
                                        th:text="${empresa.nombre}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}">
                        </div>
                    </div>
                    <div style="margin-top: 16px;">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" th:field="*{direccion}">
                    </div>
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 8px;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/cartera/registros}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
