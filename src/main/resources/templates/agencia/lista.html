<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencias — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Admin</span>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Agencias</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <!-- Page header -->
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Agencias</h1>
                <p class="page-subtitle">Sucursales y agencias del sistema</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/agencias/nuevo}" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Agencia
                </a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success animate-in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger animate-in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Table -->
        <div class="card animate-in stagger-1">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Código</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Estado</th>
                            <th class="col-actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="agencia : ${agencias}">
                            <td>
                                <a th:href="@{/agencias/editar/{id}(id=${agencia.id})}"
                                   th:text="${agencia.nombre}"
                                   style="font-weight: 500;">-</a>
                            </td>
                            <td>
                                <span th:if="${agencia.codigo}" class="font-mono text-muted"
                                      th:text="${agencia.codigo}">-</span>
                                <span th:if="${!agencia.codigo}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${agencia.telefono}" th:text="${agencia.telefono}">-</span>
                                <span th:if="${!agencia.telefono}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${agencia.direccion}" th:text="${agencia.direccion}">-</span>
                                <span th:if="${!agencia.direccion}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${agencia.activo}" class="badge badge-success">Activo</span>
                                <span th:if="${!agencia.activo}" class="badge badge-default">Inactivo</span>
                            </td>
                            <td class="col-actions">
                                <a th:href="@{/agencias/editar/{id}(id=${agencia.id})}"
                                   class="btn-icon" title="Editar">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                    </svg>
                                </a>
                                <form th:action="@{/agencias/eliminar/{id}(id=${agencia.id})}" method="post"
                                      style="display: inline;"
                                      onsubmit="return confirm('¿Eliminar esta agencia?')">
                                    <button type="submit" class="btn-icon" title="Eliminar"
                                            style="color: var(--color-danger);">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"/>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                        </svg>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(agencias)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                                    </svg>
                                    <h3>Sin agencias</h3>
                                    <p>No hay agencias registradas. Crea la primera.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
