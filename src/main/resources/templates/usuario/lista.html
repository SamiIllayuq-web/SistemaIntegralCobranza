<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Sistema Integral de Cobranza</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Admin</span>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Usuarios</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <!-- Page header -->
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Usuarios</h1>
                <p class="page-subtitle"> Gestión de usuarios del sistema</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nuevo Usuario
                </a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success animate-in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger animate-in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="stats-grid animate-in stagger-1" style="margin-bottom: 24px;">
            <div class="stat-card">
                <div class="stat-label">Total Usuarios</div>
                <div class="stat-value" th:text="${#lists.size(usuarios)}">0</div>
            </div>
        </div>

        <!-- Table -->
        <div class="card animate-in stagger-2">
            <div th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <h3>Sin usuarios</h3>
                <p>No hay usuarios registrados en el sistema.</p>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary" style="margin-top: 12px;">Crear Usuario</a>
            </div>

            <div class="table-wrapper" th:if="${!#lists.isEmpty(usuarios)}">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Activo</th>
                            <th class="col-actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td>
                                <span class="font-mono" th:text="${usuario.username}">user</span>
                            </td>
                            <td>
                                <span style="font-weight: 500;" th:text="${usuario.nombreCompleto}">-</span>
                            </td>
                            <td>
                                <span th:if="${usuario.rol != null}" class="badge badge-info" th:text="${usuario.rol}">ROL</span>
                                <span th:unless="${usuario.rol != null}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${usuario.activo}" class="badge badge-success">Activo</span>
                                <span th:unless="${usuario.activo}" class="badge badge-danger">Inactivo</span>
                            </td>
                            <td class="col-actions">
                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                   class="btn-icon" title="Editar usuario">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                    </svg>
                                </a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                                   class="btn-icon btn-icon-danger" title="Eliminar usuario"
                                   onclick="return confirm('¿Está seguro de eliminar este usuario?')">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                    </svg>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
(function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'light') {
        document.body.classList.add('theme-light');
    }
})();
/*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
