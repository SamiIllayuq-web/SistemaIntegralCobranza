<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Empresas</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted"
                  th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Empresas</h1>
                <p class="page-subtitle">Gestión de empresas asociadas</p>
            </div>
            <div class="page-actions" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/empresas/nuevo}" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Empresa
                </a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success animate-in" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger animate-in" th:text="${error}"></div>

        <div class="card animate-in stagger-1">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>RUC</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Activo</th>
                            <th class="col-actions" sec:authorize="hasRole('ADMIN')">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="empresa : ${empresas}">
                            <td th:text="${empresa.id}">-</td>
                            <td th:text="${empresa.nombre}">-</td>
                            <td th:text="${empresa.ruc}">-</td>
                            <td th:text="${empresa.telefono}">-</td>
                            <td th:text="${empresa.email}">-</td>
                            <td>
                                <span th:if="${empresa.activo}" class="badge badge-success">Sí</span>
                                <span th:if="${!empresa.activo}" class="badge badge-danger">No</span>
                            </td>
                            <td class="col-actions" sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/empresas/editar/{id}(id=${empresa.id})}" class="btn-icon" title="Editar">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                    </svg>
                                </a>
                                <a th:href="@{/empresas/eliminar/{id}(id=${empresa.id})}"
                                   class="btn-icon" title="Eliminar"
                                   onclick="return confirm('¿Eliminar esta empresa?')">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                        <polyline points="9 22 9 12 15 12 15 22"/>
                                    </svg>
                                    <h3>Sin empresas</h3>
                                    <p>No hay empresas registradas.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
