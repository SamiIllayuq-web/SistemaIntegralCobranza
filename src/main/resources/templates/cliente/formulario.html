<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${clienteId != null ? 'Editar Cliente' : 'Nuevo Cliente'}">Cliente — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <a th:href="@{/clientes}">Clientes</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);" th:text="${clienteId != null ? 'Editar' : 'Nuevo'}">Formulario</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <div class="page-header animate-in">
            <div>
                <h1 class="page-title" th:text="${clienteId != null ? 'Editar Cliente' : 'Nuevo Cliente'}">Cliente</h1>
                <p class="page-subtitle" th:text="${clienteId != null ? 'Modificar datos del cliente' : 'Registrar un nuevo cliente'}"></p>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger animate-in" th:text="${error}"></div>

        <form th:action="@{/clientes/guardar}" th:object="${clienteForm}" method="post">
            <input type="hidden" name="clienteId" th:value="${clienteId}" />

            <div class="card animate-in stagger-1">
                <div class="card-header">Información General</div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="form-label">Nombre Completo *</label>
                            <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
                        </div>
                        <div>
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control" th:field="*{dni}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card animate-in stagger-2" style="margin-top: 16px;">
                <div class="card-header">Información de Contacto</div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="form-label">Teléfono 1</label>
                            <input type="text" class="form-control" th:field="*{telefono}">
                        </div>
                        <div>
                            <label class="form-label">Teléfono 2</label>
                            <input type="text" class="form-control" th:field="*{telefono2}">
                        </div>
                        <div>
                            <label class="form-label">Teléfono 3</label>
                            <input type="text" class="form-control" th:field="*{telefono3}">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
                        <div>
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div>
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" th:field="*{direccion}">
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 8px;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/clientes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
