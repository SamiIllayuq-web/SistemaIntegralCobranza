<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${clienteId != null ? 'Editar Cliente' : 'Nuevo Cliente'}">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Cobranza</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Inicio</a>
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/operaciones}">Operaciones</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${clienteId != null ? 'Editar Cliente' : 'Nuevo Cliente'}"></h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/clientes/guardar}" th:object="${clienteForm}" method="post">
            <input type="hidden" name="clienteId" th:value="${clienteId}" />

            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Información General</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre Completo *</label>
                            <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="dni" class="form-label">DNI</label>
                            <input type="text" class="form-control" id="dni" th:field="*{dni}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="empresaId" class="form-label">Empresa *</label>
                            <select class="form-select" id="empresaId" th:field="*{empresaId}" required>
                                <option value="">Seleccione una empresa</option>
                                <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="agenciaId" class="form-label">Agencia</label>
                            <input type="number" class="form-control" id="agenciaId" th:field="*{agenciaId}" placeholder="ID de agencia">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="numeroCuenta" class="form-label">N° Cuenta</label>
                            <input type="text" class="form-control" id="numeroCuenta" th:field="*{numeroCuenta}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="numeroOperacion" class="form-label">N° Operación</label>
                            <input type="text" class="form-control" id="numeroOperacion" th:field="*{numeroOperacion}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="deudaCapital" class="form-label">Deuda Capital</label>
                            <input type="number" step="0.01" class="form-control" id="deudaCapital" th:field="*{deudaCapital}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="deudaTotal" class="form-label">Deuda Total</label>
                            <input type="number" step="0.01" class="form-control" id="deudaTotal" th:field="*{deudaTotal}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="estadoGestion" class="form-label">Estado Gestión</label>
                            <input type="text" class="form-control" id="estadoGestion" th:field="*{estadoGestion}" placeholder="Ej: Sin Gestionar">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Información de Contacto</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="telefono" class="form-label">Teléfono 1</label>
                            <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="telefono2" class="form-label">Teléfono 2</label>
                            <input type="text" class="form-control" id="telefono2" th:field="*{telefono2}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="telefono3" class="form-label">Teléfono 3</label>
                            <input type="text" class="form-control" id="telefono3" th:field="*{telefono3}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="direccion" th:field="*{direccion}">
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Observaciones</h5>
                </div>
                <div class="card-body">
                    <textarea class="form-control" id="observaciones" th:field="*{observaciones}" rows="3"></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
