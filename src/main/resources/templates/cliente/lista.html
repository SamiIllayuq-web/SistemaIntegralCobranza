<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Cobranza</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Inicio</a>
                <a class="nav-link" th:href="@{/empresas}">Empresas</a>
                <a class="nav-link" th:href="@{/agencias}">Agencias</a>
                <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/cartera/importar}">Cartera</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Clientes</h2>
            <div>
                <a th:href="@{/clientes/nuevo}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">Nuevo Cliente</a>
                <a th:href="@{/cartera/importar}" class="btn btn-info" sec:authorize="hasRole('ADMIN')">Importar Cartera</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Filtros de búsqueda -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Búsqueda</h5>
                <form th:action="@{/clientes}" method="get" class="row g-3">
                    <div class="col-md-2">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" th:value="${busqueda.nombre}" placeholder="Nombre del cliente">
                    </div>
                    <div class="col-md-2">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" class="form-control" id="dni" name="dni" th:value="${busqueda.dni}" placeholder="DNI">
                    </div>
                    <div class="col-md-2">
                        <label for="numeroCuenta" class="form-label">N° Cuenta</label>
                        <input type="text" class="form-control" id="numeroCuenta" name="numeroCuenta" th:value="${busqueda.numeroCuenta}" placeholder="N° Cuenta">
                    </div>
                    <div class="col-md-2">
                        <label for="numeroOperacion" class="form-label">N° Operación</label>
                        <input type="text" class="form-control" id="numeroOperacion" name="numeroOperacion" th:value="${busqueda.numeroOperacion}" placeholder="N° Operación">
                    </div>
                    <div class="col-md-2">
                        <label for="empresaId" class="form-label">Empresa</label>
                        <select class="form-select" id="empresaId" name="empresaId">
                            <option value="">Todas</option>
                            <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}" th:selected="${busqueda.empresaId == emp.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Empresa</th>
                    <th>N° Cuenta</th>
                    <th>N° Operación</th>
                    <th>Deuda Capital</th>
                    <th>Deuda Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.nombreCompleto}"></td>
                    <td th:text="${cliente.dni}"></td>
                    <td th:text="${cliente.empresaNombre}"></td>
                    <td th:text="${cliente.numeroCuenta}"></td>
                    <td th:text="${cliente.numeroOperacion}"></td>
                    <td th:text="${'S/ ' + #numbers.formatDecimal(cliente.deudaCapital, 1, 2)}"></td>
                    <td th:text="${'S/ ' + #numbers.formatDecimal(cliente.deudaTotal, 1, 2)}"></td>
                    <td th:text="${cliente.estadoGestion}"></td>
                    <td>
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-primary">Ver</a>
                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-warning" sec:authorize="hasRole('ADMIN')">Editar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="9" class="text-center">No hay clientes registrados</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
