<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedientes - Sistema Integral de Cobranza</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Expedientes</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted" th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">18 Jul 2026</span>
        </div>
    </div>

    <div class="page-content">
        <!-- Page Header -->
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Expedientes</h1>
                <p class="page-subtitle">Gestión de expedientes judiciales y cobranzas</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/expedientes/importar}" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                    Importar
                </a>
                <a th:href="@{/expedientes/nuevo}" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nuevo Expediente
                </a>
            </div>
        </div>

        <!-- Alert -->
        <div th:if="${success}" class="alert alert-success animate-in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span th:text="${success}"></span>
        </div>

        <!-- Filters -->
        <div class="filters-bar animate-in stagger-1">
            <form th:action="@{/expedientes}" method="get">
                <div class="filters-grid">
                    <div>
                        <label class="form-label">Empresa</label>
                        <select class="form-select" name="empresaId">
                            <option value="">Todas</option>
                            <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}" th:selected="${empresaIdSeleccionada == emp.id}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Situación</label>
                        <select class="form-select" name="situacion">
                            <option value="">Todas</option>
                            <option value="Judicial" th:selected="${situacionSeleccionada == 'Judicial'}">Judicial</option>
                            <option value="Castigada" th:selected="${situacionSeleccionada == 'Castigada'}">Castigada</option>
                            <option value="En Tramite" th:selected="${situacionSeleccionada == 'En Tramite'}">En Tramite</option>
                            <option value="Finalizada" th:selected="${situacionSeleccionada == 'Finalizada'}">Finalizada</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Búsqueda</label>
                        <input type="text" class="form-control" name="busqueda" th:value="${busqueda}" placeholder="N° Expediente...">
                    </div>
                    <div style="display: flex; gap: .5rem; align-items: flex-end;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Buscar</button>
                        <a th:href="@{/expedientes}" class="btn btn-ghost">Limpiar</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="card animate-in stagger-2">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>N° Expediente</th>
                            <th>Situación</th>
                            <th>Empresa</th>
                            <th>Tipo Proceso</th>
                            <th>Distrito</th>
                            <th>Clientes</th>
                            <th>Bienes</th>
                            <th class="col-actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="exp : ${expedientes.content}">
                            <td class="col-number" th:text="${exp.id}"></td>
                            <td>
                                <a th:href="@{/expedientes/{id}(id=${exp.id})}" style="font-weight: 500; color: var(--color-primary);" th:text="${exp.numeroExpediente}"></a>
                            </td>
                            <td>
                                <span class="badge badge-judicial" th:if="${exp.situacion == 'Judicial'}" th:text="${exp.situacion}"></span>
                                <span class="badge badge-castigada" th:if="${exp.situacion == 'Castigada'}" th:text="${exp.situacion}"></span>
                                <span class="badge badge-finalizada" th:if="${exp.situacion == 'Finalizada'}" th:text="${exp.situacion}"></span>
                                <span class="badge badge-en-tramite" th:if="${exp.situacion == 'En Tramite'}" th:text="${exp.situacion}"></span>
                                <span class="badge badge-default" th:if="${exp.situacion != 'Judicial' and exp.situacion != 'Castigada' and exp.situacion != 'Finalizada' and exp.situacion != 'En Tramite'}" th:text="${exp.situacion}"></span>
                            </td>
                            <td th:text="${exp.empresa?.nombre}"></td>
                            <td th:text="${exp.tipoProceso}"></td>
                            <td th:text="${exp.distritoJudicial}"></td>
                            <td>
                                <span class="badge badge-default" th:text="${#lists.size(exp.clientes)}">0</span>
                            </td>
                            <td>
                                <span class="badge badge-default" th:text="${#lists.size(exp.bienes)}">0</span>
                            </td>
                            <td class="col-actions">
                                <a th:href="@{/expedientes/{id}(id=${exp.id})}" class="btn-icon" title="Ver detalle">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </a>
                                <a th:href="@{/expedientes/{id}/editar(id=${exp.id})}" class="btn-icon" title="Editar">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(expedientes.content)}">
                            <td colspan="9">
                                <div class="empty-state">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                    <h3>No hay datos</h3>
                                    <p>No se encontraron expedientes con los filtros seleccionados.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="card-footer" th:if="${expedientes.totalPages > 1}" style="display: flex; justify-content: center; padding: .75rem;">
                <div class="pagination">
                    <a class="pagination-btn"
                       th:href="@{/expedientes(page=${expedientes.number - 1}, empresaId=${empresaIdSeleccionada}, situacion=${situacionSeleccionada}, busqueda=${busqueda})}"
                       th:classappend="${expedientes.number == 0 ? 'disabled' : ''}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    </a>

                    <a class="pagination-btn"
                       th:each="i : ${#numbers.sequence(0, expedientes.totalPages - 1)}"
                       th:href="@{/expedientes(page=${i}, empresaId=${empresaIdSeleccionada}, situacion=${situacionSeleccionada}, busqueda=${busqueda})}"
                       th:text="${i + 1}"
                       th:classappend="${i == expedientes.number ? 'active' : ''}"></a>

                    <a class="pagination-btn"
                       th:href="@{/expedientes(page=${expedientes.number + 1}, empresaId=${empresaIdSeleccionada}, situacion=${situacionSeleccionada}, busqueda=${busqueda})}"
                       th:classappend="${expedientes.number == expedientes.totalPages - 1 ? 'disabled' : ''}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
