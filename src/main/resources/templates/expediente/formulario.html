<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${expediente?.id != null ? 'Editar Expediente' : 'Nuevo Expediente'} + ' - Sistema Integral de Cobranza'">Expediente - Sistema Integral de Cobranza</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <a th:href="@{/expedientes}">Expedientes</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);" th:text="${expediente?.id != null ? 'Editar' : 'Nuevo'}">Formulario</span>
        </div>
        <div class="topbar-actions">
            <a th:href="@{/expedientes}" class="btn btn-secondary btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Volver
            </a>
        </div>
    </div>

    <div class="page-content">
        <!-- Page Header -->
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title" th:text="${expediente?.id != null ? 'Editar Expediente' : 'Nuevo Expediente'}">Expediente</h1>
                <p class="page-subtitle" th:text="${expediente?.id != null ? 'Modifique los datos del expediente' : 'Ingrese los datos del nuevo expediente'}">Formulario</p>
            </div>
        </div>

        <!-- Alert -->
        <div th:if="${error}" class="alert alert-danger animate-in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Form -->
        <div class="card animate-in stagger-1">
            <div class="card-header">
                <span class="card-title">Datos del Expediente</span>
            </div>
            <div class="card-body">
                <form th:action="@{/expedientes/guardar}" method="post" th:object="${expediente}">
                    <!-- Hidden fields -->
                    <input type="hidden" th:field="*{id}" th:if="${expediente?.id != null}">
                    <input type="hidden" name="empresaId" th:value="${expediente?.empresa?.id}" th:if="${expediente?.id != null}">

                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">
                        <!-- Numero Expediente -->
                        <div class="form-group">
                            <label class="form-label" for="numeroExpediente">N° Expediente *</label>
                            <input type="text" id="numeroExpediente" class="form-control" th:field="*{numeroExpediente}" placeholder="00265-2025-0-3402-JM-CI-01" required>
                            <div class="form-error" th:if="${#fields.hasErrors('numeroExpediente')}" th:errors="*{numeroExpediente}"></div>
                        </div>

                        <!-- Situacion -->
                        <div class="form-group">
                            <label class="form-label" for="situacion">Situación *</label>
                            <select id="situacion" class="form-select" th:field="*{situacion}" required>
                                <option value="">Seleccionar</option>
                                <option value="Judicial">Judicial</option>
                                <option value="Castigada">Castigada</option>
                                <option value="En Tramite">En Tramite</option>
                                <option value="Finalizada">Finalizada</option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('situacion')}" th:errors="*{situacion}"></div>
                        </div>

                        <!-- Tipo Proceso -->
                        <div class="form-group">
                            <label class="form-label" for="tipoProceso">Tipo Proceso</label>
                            <input type="text" id="tipoProceso" class="form-control" th:field="*{tipoProceso}" placeholder="Civil, Penal, Comercial...">
                        </div>

                        <!-- Tipo Juzgado -->
                        <div class="form-group">
                            <label class="form-label" for="tipoJuzgado">Tipo Juzgado</label>
                            <input type="text" id="tipoJuzgado" class="form-control" th:field="*{tipoJuzgado}" placeholder="Civil, laboral...">
                        </div>

                        <!-- Distrito Judicial -->
                        <div class="form-group">
                            <label class="form-label" for="distritoJudicial">Distrito Judicial</label>
                            <input type="text" id="distritoJudicial" class="form-control" th:field="*{distritoJudicial}" placeholder="Lima, Callao...">
                        </div>

                        <!-- Numero Juzgado -->
                        <div class="form-group">
                            <label class="form-label" for="numeroJuzgado">N° Juzgado</label>
                            <input type="text" id="numeroJuzgado" class="form-control" th:field="*{numeroJuzgado}" placeholder="1, 2, 3...">
                        </div>

                        <!-- Incidente -->
                        <div class="form-group">
                            <label class="form-label" for="incidente">Incidente</label>
                            <input type="text" id="incidente" class="form-control" th:field="*{incidente}" placeholder="N° Incidente">
                        </div>

                        <!-- Monto Demandado -->
                        <div class="form-group">
                            <label class="form-label" for="montoDemandado">Monto Demandado</label>
                            <input type="number" step="0.01" id="montoDemandado" class="form-control" th:field="*{montoDemandado}" placeholder="0.00">
                        </div>

                        <!-- Especialista Legal -->
                        <div class="form-group">
                            <label class="form-label" for="especialistaLegal">Especialista Legal</label>
                            <input type="text" id="especialistaLegal" class="form-control" th:field="*{especialistaLegal}" placeholder="Nombre del especialista">
                        </div>

                        <!-- Etapa Procesal -->
                        <div class="form-group">
                            <label class="form-label" for="etapaProcesal">Etapa Procesal</label>
                            <input type="text" id="etapaProcesal" class="form-control" th:field="*{etapaProcesal}" placeholder="Etapa actual del proceso">
                        </div>

                        <!-- Empresa -->
                        <div class="form-group">
                            <label class="form-label" for="empresaId">Empresa *</label>
                            <select id="empresaId" class="form-select" name="empresaId" required>
                                <option value="">Seleccionar empresa</option>
                                <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}" th:selected="${expediente?.empresa?.id == emp.id}"></option>
                            </select>
                        </div>

                        <!-- Agencia -->
                        <div class="form-group">
                            <label class="form-label" for="agenciaId">Agencia</label>
                            <select id="agenciaId" class="form-select" name="agenciaId">
                                <option value="">Seleccionar agencia</option>
                                <option th:each="ag : ${agencias}" th:value="${ag.id}" th:text="${ag.nombre}" th:selected="${expediente?.agencia?.id == ag.id}"></option>
                            </select>
                        </div>

                        <!-- Abogado -->
                        <div class="form-group">
                            <label class="form-label" for="abogadoId">Abogado</label>
                            <select id="abogadoId" class="form-select" name="abogadoId">
                                <option value="">Seleccionar abogado</option>
                                <option th:each="ab : ${abogados}" th:value="${ab.id}" th:text="${ab.nombreCompleto}" th:selected="${expediente?.abogado?.id == ab.id}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Observacion -->
                    <div class="form-group mt-1">
                        <label class="form-label" for="observacion">Observación</label>
                        <textarea id="observacion" class="form-control" th:field="*{observacion}" rows="3" placeholder="Observaciones relevantes del expediente..."></textarea>
                    </div>

                    <!-- Comentario General -->
                    <div class="form-group">
                        <label class="form-label" for="comentarioGeneral">Comentario General</label>
                        <textarea id="comentarioGeneral" class="form-control" th:field="*{comentarioGeneral}" rows="3" placeholder="Comentarios adicionales..."></textarea>
                    </div>

                    <!-- Actions -->
                    <div class="flex-gap" style="margin-top: 1.5rem; justify-content: flex-end;">
                        <a th:href="@{/expedientes}" class="btn btn-ghost">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span th:text="${expediente?.id != null ? 'Actualizar' : 'Guardar'}">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

</body>
</html>
