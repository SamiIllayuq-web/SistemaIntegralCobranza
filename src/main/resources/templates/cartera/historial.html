<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Importaciones - Sistema de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Cobranza</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Inicio</a>
                <a class="nav-link" th:href="@{/empresas}">Empresas</a>
                <a class="nav-link" th:href="@{/agencias}">Agencias</a>
                <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/operaciones}">Operaciones</a>
                <a class="nav-link" th:href="@{/cartera/importar}">Cartera</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Historial de Importaciones</h2>
            <a th:href="@{/cartera/importar}" class="btn btn-primary">Nueva Importación</a>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Archivo</th>
                    <th>Empresa</th>
                    <th>Agencia</th>
                    <th>Total</th>
                    <th>Exitosos</th>
                    <th>Fallidos</th>
                    <th>Estado</th>
                    <th>Usuario</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="imp : ${importaciones}">
                    <td th:text="${imp.fechaImportacion}"></td>
                    <td th:text="${imp.nombreArchivo}"></td>
                    <td th:text="${imp.empresaNombre}"></td>
                    <td th:text="${imp.agenciaNombre ?: '-'}"></td>
                    <td th:text="${imp.totalRegistros}"></td>
                    <td class="text-success" th:text="${imp.registrosExitosos}"></td>
                    <td class="text-danger" th:text="${imp.registrosFallidos}"></td>
                    <td th:text="${imp.estado}"></td>
                    <td th:text="${imp.usuarioImporta}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(importaciones)}">
                    <td colspan="9" class="text-center">No hay importaciones registradas</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
