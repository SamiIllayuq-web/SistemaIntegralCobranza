<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Importaciones — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <a th:href="@{/cartera/registros}">Cartera</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Historial</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Historial de Importaciones</h1>
                <p class="page-subtitle">Registro de todas las importaciones realizadas</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/cartera/importar}" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Importación
                </a>
            </div>
        </div>

        <!-- Table -->
        <div class="card animate-in stagger-1">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Archivo</th>
                            <th>Empresa</th>
                            <th>Agencia</th>
                            <th>Total</th>
                            <th>Exitosos</th>
                            <th>Fallidos</th>
                            <th>Estado</th>
                            <th>Usuario</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="imp : ${importaciones}">
                            <td th:text="${imp.fechaImportacion}">-</td>
                            <td th:text="${imp.nombreArchivo}">-</td>
                            <td th:text="${imp.empresaNombre}">-</td>
                            <td th:text="${imp.agenciaNombre ?: '-'}">-</td>
                            <td th:text="${imp.totalRegistros}">-</td>
                            <td>
                                <span class="badge badge-success" th:text="${imp.registrosExitosos}">0</span>
                            </td>
                            <td>
                                <span class="badge badge-danger" th:text="${imp.registrosFallidos}">0</span>
                            </td>
                            <td th:text="${imp.estado}">-</td>
                            <td th:text="${imp.usuarioImporta}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(importaciones)}">
                            <td colspan="9">
                                <div class="empty-state">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <circle cx="12" cy="12" r="10"/>
                                        <polyline points="12 6 12 12 16 14"/>
                                    </svg>
                                    <h3>Sin importaciones</h3>
                                    <p>No hay importaciones registradas todavía.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
