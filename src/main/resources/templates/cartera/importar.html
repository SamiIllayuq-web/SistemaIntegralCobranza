<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Cartera — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <a th:href="@{/dashboard}">Inicio</a>
            <span class="breadcrumb-sep">/</span>
            <a th:href="@{/operaciones}">Cartera</a>
            <span class="breadcrumb-sep">/</span>
            <span style="color: var(--color-text);">Importar</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted js-today">Hoy</span>
        </div>
    </div>

    <div class="page-content">

        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Importar Cartera</h1>
                <p class="page-subtitle">Cargar operaciones desde archivo Excel</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/operaciones/nuevo}" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Operación
                </a>
                <button class="btn btn-ghost btn-sm btn-danger-outline" onclick="resetAllData()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                    Limpiar datos
                </button>
                <a th:href="@{/cartera/historial}" class="btn btn-ghost btn-sm">Ver Historial</a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success animate-in" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger animate-in" th:text="${error}"></div>

        <!-- Upload form -->
        <div class="card animate-in stagger-1">
            <div class="card-header">Cargar archivo Excel</div>
            <div class="card-body">
                <form th:action="@{/cartera/importar}" method="post" enctype="multipart/form-data">
                    <div style="margin-top: 16px;">
                        <label class="form-label">Archivo Excel *</label>
                        <input type="file" class="form-control" name="archivo" accept=".xlsx,.xls" required>
                        <small class="text-muted">La agencia se extrae automáticamente de la columna "agencia" del Excel</small>
                    </div>
                    <input type="hidden" name="usuario" th:value="${usuarioNombre}">
                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
                            </svg>
                            Importar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function resetAllData() {
    if (!confirm('¿Eliminar TODOS los datos importados? Esta acción no se puede deshacer.')) return;
    try {
        const res = await fetch('/api/admin/reset', { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
            alert(`Datos eliminados:\n• Operaciones: ${data.operacionesEliminadas}\n• Clientes: ${data.clientesEliminados}\n• Bienes embargados: ${data.bienesEliminados}\n• Importaciones: ${data.importacionesEliminadas}`);
            location.reload();
        } else {
            alert('Error: ' + (data.mensaje || 'desconocido'));
        }
    } catch (e) {
        alert('Error de conexión: ' + e.message);
    }
}
</script>
</body>
</html>
