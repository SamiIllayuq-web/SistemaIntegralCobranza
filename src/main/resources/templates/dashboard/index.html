<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio — Sistema Integral de Cobranza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<th:block th:replace="~{layout :: sidebar}"></th:block>

<div class="main-content">
    <div class="topbar">
        <div class="breadcrumb-nav">
            <span style="color: var(--color-text);">Inicio</span>
        </div>
        <div class="topbar-actions">
            <span class="text-small text-muted" th:text="${fechaHoy}">Hoy</span>
        </div>
    </div>

    <div class="page-content">
        <!-- Header -->
        <div class="page-header animate-in">
            <div>
                <h1 class="page-title">Bienvenido</h1>
                <p class="page-subtitle">Sistema Integral de Gestión y Análisis de Información</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid animate-in stagger-1">
            <div class="stat-card">
                <div class="stat-label">Total Operaciones</div>
                <div class="stat-value" th:text="${totalOperaciones}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Clientes</div>
                <div class="stat-value" th:text="${totalClientes}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Empresas</div>
                <div class="stat-value" th:text="${totalEmpresas}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Importaciones</div>
                <div class="stat-value" th:text="${totalImportaciones}">0</div>
            </div>
        </div>

        <!-- Quick links -->
        <div class="card animate-in stagger-2">
            <div class="card-header">Accesos Rápidos</div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                    <a th:href="@{/cartera/registros}" class="btn btn-secondary" style="justify-content: flex-start;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        Ver Registros
                    </a>
                    <a th:href="@{/cartera/expedientes}" class="btn btn-secondary" style="justify-content: flex-start;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        Expedientes
                    </a>
                    <a th:href="@{/cartera/importar}" class="btn btn-secondary" style="justify-content: flex-start;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
                        </svg>
                        Importar Cartera
                    </a>
                    <a th:href="@{/clientes}" class="btn btn-secondary" style="justify-content: flex-start;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                        Clientes
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
