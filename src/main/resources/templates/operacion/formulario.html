<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${operacionId != null ? 'Editar Operación' : 'Nueva Operación'}">Operación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Cobranza</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/dashboard}">Inicio</a>
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${operacionId != null ? 'Editar Operación' : 'Nueva Operación'}"></h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/operaciones/guardar}" th:object="${operacionForm}" method="post">
            <input type="hidden" name="id" th:value="${operacionId}" />

            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Datos de la Operación</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="empresaId" class="form-label">Empresa</label>
                            <select class="form-select" id="empresaId" th:field="*{empresaId}">
                                <option value="">Seleccione empresa</option>
                                <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="agenciaId" class="form-label">Agencia</label>
                            <input type="number" class="form-control" id="agenciaId" th:field="*{agenciaId}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cuenta" class="form-label">N° Cuenta</label>
                            <input type="text" class="form-control" id="cuenta" th:field="*{cuenta}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="numeroOperacion" class="form-label">N° Operación</label>
                            <input type="text" class="form-control" id="numeroOperacion" th:field="*{numeroOperacion}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="montoCapital" class="form-label">Monto Capital</label>
                            <input type="number" step="0.01" class="form-control" id="montoCapital" th:field="*{montoCapital}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="montoTotal" class="form-label">Monto Total</label>
                            <input type="number" step="0.01" class="form-control" id="montoTotal" th:field="*{montoTotal}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="diasMora" class="form-label">Días Mora</label>
                            <input type="number" class="form-control" id="diasMora" th:field="*{diasMora}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="moneda" class="form-label">Moneda</label>
                            <input type="text" class="form-control" id="moneda" th:field="*{moneda}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="tipoCredito" class="form-label">Tipo Crédito</label>
                            <input type="text" class="form-control" id="tipoCredito" th:field="*{tipoCredito}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="situacion" class="form-label">Situación</label>
                            <input type="text" class="form-control" id="situacion" th:field="*{situacion}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <input type="text" class="form-control" id="estado" th:field="*{estado}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="etapa" class="form-label">Etapa</label>
                            <input type="text" class="form-control" id="etapa" th:field="*{etapa}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="rango" class="form-label">Rango</label>
                            <input type="text" class="form-control" id="rango" th:field="*{rango}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="analista" class="form-label">Analista</label>
                            <input type="text" class="form-control" id="analista" th:field="*{analista}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="analistaSenior" class="form-label">Analista Senior</label>
                            <input type="text" class="form-control" id="analistaSenior" th:field="*{analistaSenior}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="observacion" class="form-label">Observación</label>
                        <textarea class="form-control" id="observacion" th:field="*{observacion}" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Datos del Expediente Judicial</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="numeroExpediente" class="form-label">N° Expediente</label>
                            <input type="text" class="form-control" id="numeroExpediente" th:field="*{numeroExpediente}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tipoProceso" class="form-label">Tipo Proceso</label>
                            <input type="text" class="form-control" id="tipoProceso" th:field="*{tipoProceso}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="tipoJuzgado" class="form-label">Tipo Juzgado</label>
                            <input type="text" class="form-control" id="tipoJuzgado" th:field="*{tipoJuzgado}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="distritoJudicial" class="form-label">Distrito Judicial</label>
                            <input type="text" class="form-control" id="distritoJudicial" th:field="*{distritoJudicial}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="numeroJuzgado" class="form-label">N° Juzgado</label>
                            <input type="text" class="form-control" id="numeroJuzgado" th:field="*{numeroJuzgado}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="observacionActos" class="form-label">Observación Actos</label>
                        <textarea class="form-control" id="observacionActos" th:field="*{observacionActos}" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="comentario" class="form-label">Comentario</label>
                        <textarea class="form-control" id="comentario" th:field="*{comentario}" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:if="${operacionId != null}" th:href="@{/operaciones/{id}(id=${operacionId})}" class="btn btn-secondary">Cancelar</a>
            <a th:unless="${operacionId != null}" th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
        </form>

        <!-- Bienes Embargados -->
        <div class="card mb-4" th:if="${operacionId != null}">
            <div class="card-header bg-warning text-dark">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Bienes Embargados</h5>
                    <button type="button" class="btn btn-sm btn-outline-dark" onclick="agregarBien()">+ Agregar Bien</button>
                </div>
            </div>
            <div class="card-body p-0">
                <table class="table table-sm table-striped mb-0" id="bienesTable">
                    <thead>
                        <tr>
                            <th>Detalle Bien/Garantía</th>
                            <th>N° Partida</th>
                            <th>Tipo Bien</th>
                            <th>Dirección</th>
                            <th>Distrito</th>
                            <th>Garantía Inscrita</th>
                            <th>Monto MC</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="bienesBody">
                        <tr th:if="${operacionForm.bienesEmbargados != null}"
                            th:each="bien, stat : ${operacionForm.bienesEmbargados}"
                            th:data-index="${stat.index}">
                            <input type="hidden" th:name="'bienesEmbargados[' + ${stat.index} + '].id'"
                                   th:value="${bien.id}"/>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].detalleGarantia'"
                                       th:value="${bien.detalleGarantia}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].partidaRegistral'"
                                       th:value="${bien.partidaRegistral}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].tipoBien'"
                                       th:value="${bien.tipoBien}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].direccion'"
                                       th:value="${bien.direccion}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].distrito'"
                                       th:value="${bien.distrito}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].garantiaInscrita'"
                                       th:value="${bien.garantiaInscrita}"/></td>
                            <td><input type="text" class="form-control form-control-sm"
                                       th:name="'bienesEmbargados[' + ${stat.index} + '].montoMc'"
                                       th:value="${bien.montoMc}"/></td>
                            <td>
                                <button type="button" class="btn btn-outline-danger btn-sm py-0 px-1"
                                        onclick="eliminarBien(this)">×</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${operacionForm.bienesEmbargados == null or operacionForm.bienesEmbargados.isEmpty()}"
                     class="text-center text-muted py-3 small">
                    Sin bienes embargados registrados
                </div>
            </div>
        </div>
    </div><!-- /container -->

    <template id="bienRowTemplate">
        <tr>
            <input type="hidden" name="bienesEmbargados[__INDEX__].id" value=""/>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].detalleGarantia" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].partidaRegistral" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].tipoBien" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].direccion" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].distrito" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].garantiaInscrita" value=""/></td>
            <td><input type="text" class="form-control form-control-sm"
                       name="bienesEmbargados[__INDEX__].montoMc" value=""/></td>
            <td>
                <button type="button" class="btn btn-outline-danger btn-sm py-0 px-1"
                        onclick="eliminarBien(this)">×</button>
            </td>
        </tr>
    </template>

    <script>
    let bienIndex = [[${operacionForm.bienesEmbargados != null ? operacionForm.bienesEmbargados.size() : 0}]];

    function agregarBien() {
        const table = document.querySelector('#bienesBody');
        // Mostrar tabla si estaba vacía
        const theTable = table.parentElement.querySelector('.table');
        if (theTable) theTable.style.display = '';
        const emptyMsg = table.parentElement.querySelector('.text-center.text-muted');
        if (emptyMsg) emptyMsg.remove();
        const html = document.getElementById('bienRowTemplate').innerHTML
            .replace(/__INDEX__/g, bienIndex);
        table.insertAdjacentHTML('beforeend', html);
        bienIndex++;
    }

    function eliminarBien(btn) {
        const row = btn.closest('tr');
        row.remove();
        // Si no quedan filas visibles y hay mensaje vacío, mostrarlo
        const tbody = document.getElementById('bienesBody');
        if (tbody.querySelectorAll('tr').length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'text-center text-muted py-3 small';
            emptyDiv.textContent = 'Sin bienes embargados registrados';
            tbody.parentElement.querySelector('.table').style.display = 'none';
            const msg = tbody.parentElement.querySelector('.text-center.text-muted');
            if (!msg) {
                const div = document.createElement('div');
                div.className = 'text-center text-muted py-3 small';
                div.textContent = 'Sin bienes embargados registrados';
                tbody.parentElement.appendChild(div);
            }
        }
    }
    </script>
</body>
</html>
